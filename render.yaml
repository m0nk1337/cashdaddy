# One-click free deploy on Render (free forever — services sleep when idle;
# keep them awake with free pings from cron-job.org, see final message):
#   Render Dashboard → New → Blueprint → select this repo on GitHub.
# DATABASE_URL is asked for at creation time — paste your Neon (free tier)
# connection string there: https://console.neon.tech → your project → Connection Details.
services:
  - type: web
    name: cashdaddy-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_URL
        value: https://cashdaddy.me
      - key: DATABASE_URL
        sync: false # paste Neon connection string (starts with postgresql://)
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_MODE
        value: log

  - type: web
    name: cashdaddy-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./client
    dockerfilePath: ./client/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.cashdaddy.me
