# One-click free deploy on Render (free forever — services sleep when idle;
# keep them awake with free pings from cron-job.org, see final message):
#   Render Dashboard → New → Blueprint → select this repo on GitHub.
# DATABASE_URL is asked for at creation time — paste your Neon (free tier)
# connection string there: https://console.neon.tech → your project → Connection Details.
services:
  - type: web
    name: cashdaddy-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_URL
        value: https://cashdaddy.me
      - key: DATABASE_URL
        sync: false # paste Neon connection string (starts with postgresql://)
      - key: JWT_SECRET
        generateValue: true
      # Email: Render FREE blocks outbound SMTP ports (25/465/587), so send via
      # Resend's HTTP API (port 443): set EMAIL_MODE=resend, RESEND_API_KEY
      # (sending-only key scoped to mail.cashdaddy.me), EMAIL_FROM below.
      # SMTP_* is only used by EMAIL_MODE=smtp, which needs a paid instance.
      # sync:false keeps dashboard values authoritative on blueprint re-syncs.
      - key: EMAIL_MODE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: cashdaddy-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./client
    dockerfilePath: ./client/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.cashdaddy.me
